data: 
  n_trajectories: 484
  t_steps: 64

  ##### generation configs, blind to solver #####
  seed: 42
  x_min: 0.5
  x_max: 3.5
  noise: 0.01

gen_params:
  A_min: 0.5
  A_max: 2.0
  B_min: -0.5
  B_max: 0.5
  ##############################################

solver:

  # diff maps
  eps_diagnose: True
  epsilon: 5.0e-3
  alpha: 1
  knn: 240

  # 0-laplacian spectral basis
  M: 55

  # 1-laplacian spectral frames
  frame_retain_thres: 1.0e-4
  plot_frame_no: 36
  plot_frame_vec_scale: 0.1

  # contact form kernel vector field
  plot_W_vec_scale: 0.1

  # linear system
  max_kernel_dim: 12
  plot_kernel_dim: 0
  plot_sym_vec_scale: 0.2 
  plot_sym_subsample: 1000