data: 
  n_trajectories: 100
  t_steps: 100

  ##### generation configs, blind to solver #####
  x_min: 0.0
  x_max: 3.0
  noise: 0.02

gen_params:
  u0_min: -2.0
  u0_max: 2.0
  v0_min: 0.0
  v0_max: 3.0
  ##############################################

solver:

  # diff maps
  eps_diagnose: False # recommended true on first run
  epsilon: 0.1 # recommended val = mid point of linear section from eps_diagnose
  alpha: 1

  # 0-laplacian spectral basis
  J: 36

  # 1-laplacian spectral frames
  n_frames: 48
  plot_frame_no: 36
  plot_frame_vec_scale: 0.1

  # contact form kernel vector field
  plot_W_vec_scale: 0.1

  # linear system
  max_kernel_dim: 8
  plot_kernel_dim: 0
  plot_sym_vec_scale: 0.2 
  plot_sym_subsample: 1000