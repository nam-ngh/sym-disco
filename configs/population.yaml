data:
  n_trajectories: 100
  t_steps: 60

  ##### generation configs, blind to solver #####
  seed: 42
  x_min: 0.0
  x_max: 2.0
  noise: 0.02

gen_params:
  a: 1.0
  u0_min: 1.0
  u0_max: 5.0
  ##############################################

solver:

  # diff maps
  eps_diagnose: False
  epsilon: 0.01
  alpha: 1
  knn: null

  # 0-laplacian spectral basis
  M: 24

  # 1-laplacian spectral frames
  frame_retain_thres: 1.0e-4
  plot_frame_no: 36
  plot_frame_vec_scale: 0.15

  # contact form kernel vector field
  plot_W_vec_scale: 0.1

  # linear system
  max_kernel_dim: 12
  plot_kernel_dim: 0
  plot_sym_vec_scale: 0.2 
  plot_sym_subsample: 1000

  verbose: True
  sg_window: 10
  chunkz: 50

  plot_subsample: 3000
  analytic_validation: False